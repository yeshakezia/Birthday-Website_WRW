<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Birthday Surprise</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ambient-stars" id="ambientStars" aria-hidden="true"></div>

  <div class="app-simple">
    <section class="view active" id="viewLogin">
      <div class="panel">
        <p class="stage-eyebrow">🔒 admin area</p>
        <h1 class="panel-title">Admin Login</h1>
        <p class="panel-sub">Not linked from anywhere in the main site. Log in with the admin account created in Firebase Authentication.</p>

        <form id="loginForm" class="wish-form">
          <input type="email" id="adminEmail" placeholder="Admin email" required autocomplete="username">
          <input type="password" id="adminPassword" placeholder="Password" required autocomplete="current-password">
          <button type="submit" class="btn-primary">Login</button>
          <p class="form-note" id="loginError"></p>
        </form>
      </div>
    </section>

    <section class="view" id="viewDashboard">
      <div class="panel" style="max-width:640px; text-align:left;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <h1 class="panel-title" style="margin:0;">📋 All Wishes</h1>
          <button type="button" class="btn-outline" id="btnLogout" style="padding:8px 16px; font-size:0.8rem;">Logout</button>
        </div>
        <p class="panel-sub" id="signedInAs"></p>
        <p class="panel-sub" id="wishCount"></p>
        <div class="wish-list" id="adminWishList" style="max-height:60vh;"></div>
      </div>
    </section>
  </div>

  <!-- Detail modal -->
  <div class="floating-overlay" id="detailModal">
    <div class="floating-card" style="max-width:440px; text-align:left;">
      <p class="detail-meta" id="detailMeta"></p>
      <p class="detail-meta" id="detailCode" style="font-weight:700;"></p>
      <div class="letter-card" style="box-shadow:none; padding:20px;">
        <p class="letter-body" id="detailContent"></p>
      </div>
      <div class="detail-actions">
        <button type="button" class="btn-outline" id="btnCloseDetail">Close</button>
        <button type="button" class="btn-outline btn-danger" id="btnAdminDelete">🗑️ Delete</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
